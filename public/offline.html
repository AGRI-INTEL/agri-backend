<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — AgriIntel360</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0C1810;
      color: #E4DBC8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .logo {
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
    }
    .logo-text {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #C4923A;
    }
    .logo-text span {
      font-weight: 700;
      color: #E4DBC8;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      display: block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: #C4923A;
    }
    .subtitle {
      font-size: 1rem;
      color: #7D9486;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .info {
      font-size: 0.8125rem;
      color: #5E7A68;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: #C4923A;
      color: #0C1810;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(196,146,58,0.25);
      min-width: 200px;
    }
    .retry-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .retry-btn:active { transform: translateY(0); }
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      background: transparent;
      color: #7D9486;
      border: 1px solid rgba(196,146,58,0.2);
      border-radius: 10px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      min-width: 200px;
    }
    .secondary-btn:hover {
      border-color: rgba(196,146,58,0.4);
      color: #C4923A;
    }
    .brand {
      margin-top: 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5E7A68;
    }
    @media (prefers-reduced-motion: reduce) {
      .retry-btn { transition: none; }
      .retry-btn:hover { transform: none; }
      .secondary-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none">
        <path d="M24 8C24 8 16 18 16 28C16 32.4 19.6 36 24 36C28.4 36 32 32.4 32 28C32 18 24 8 24 8Z" stroke="#C4923A" stroke-width="2" fill="rgba(196,146,58,0.1)"/>
        <path d="M24 36V46" stroke="#C4923A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M18 40C18 40 21 42 24 42C27 42 30 40 30 40" stroke="#C4923A" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="46" x2="46" y2="46" stroke="#C4923A" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </svg>
      <span class="logo-text"><span>AgriIntel</span>360</span>
    </div>

    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#C4923A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>

    <h1>Vous êtes hors ligne</h1>
    <p class="subtitle">Veuillez vérifier votre connexion internet</p>
    <p class="info">Les données affichées peuvent ne pas être à jour. Revenez en ligne pour accéder à toutes les fonctionnalités.</p>

    <div class="actions">
      <a class="retry-btn" href="javascript:window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
        Réessayer
      </a>
      <a class="secondary-btn" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Retour à l'accueil
      </a>
    </div>

    <div class="brand">Plateforme de Décision Agricole pour l'Afrique</div>
  </div>
</body>
</html>
