<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2E1A"/>
      <stop offset="50%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#0A1A10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4923A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4923A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C4923A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#22C55E" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent line -->
  <rect x="50" y="40" width="1100" height="2" fill="url(#accent)" rx="1"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="none" stroke="#C4923A" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="1050" cy="100" r="300" fill="none" stroke="#C4923A" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="150" cy="530" r="150" fill="none" stroke="#22C55E" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Decorative dots top-right -->
  <g fill="#C4923A" fill-opacity="0.1">
    <circle cx="1000" cy="70" r="3"/><circle cx="1035" cy="70" r="3"/><circle cx="1070" cy="70" r="3"/><circle cx="1105" cy="70" r="3"/>
    <circle cx="1000" cy="105" r="3"/><circle cx="1035" cy="105" r="3"/><circle cx="1070" cy="105" r="3"/><circle cx="1105" cy="105" r="3"/>
    <circle cx="1000" cy="140" r="3"/><circle cx="1035" cy="140" r="3"/><circle cx="1070" cy="140" r="3"/><circle cx="1105" cy="140" r="3"/>
    <circle cx="1000" cy="175" r="3"/><circle cx="1035" cy="175" r="3"/><circle cx="1070" cy="175" r="3"/><circle cx="1105" cy="175" r="3"/>
  </g>

  <!-- Leaf icon -->
  <g transform="translate(540, 130)" filter="url(#shadow)">
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#leafGrad)" opacity="0.2"/>
      <path d="M12 6c-1.5 3-1.5 6 0 9s1.5 6 0 9" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M7 9c3 1.5 6 1.5 9 0s6-1.5 9 0" stroke="#C4923A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M7 15c3-1.5 6-1.5 9 0s6 1.5 9 0" stroke="#C4923A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <circle cx="9" cy="10" r="1.5" fill="#22C55E" opacity="0.3"/>
      <circle cx="15" cy="14" r="1" fill="#C4923A" opacity="0.3"/>
      <circle cx="12" cy="8" r="2" fill="#22C55E" opacity="0.2"/>
    </svg>
  </g>

  <!-- Main heading -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#E4DBC8" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">AgriIntel360</text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#C4923A" text-anchor="middle" letter-spacing="5" opacity="0.9">PLATEFORME INTELLIGENTE DE DÉCISION AGRICOLE</text>
  <text x="600" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#C4923A" text-anchor="middle" letter-spacing="5" opacity="0.9">POUR L'AFRIQUE</text>

  <!-- Decorative lines around tagline -->
  <line x1="200" y1="380" x2="400" y2="380" stroke="#C4923A" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="800" y1="380" x2="1000" y2="380" stroke="#C4923A" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Bottom detail line -->
  <rect x="150" y="480" width="900" height="1" fill="url(#accent)" rx="0.5"/>

  <!-- URL -->
  <text x="600" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="300" fill="#6B8F7A" text-anchor="middle" letter-spacing="2">agriintel360.lsgrouptogo.com</text>

  <!-- Bottom accent line -->
  <rect x="50" y="590" width="1100" height="2" fill="url(#accent)" rx="1"/>

  <!-- Sector tags bottom-left -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="24" height="8" rx="4" fill="#22C55E" opacity="0.3"/>
    <rect x="30" y="0" width="24" height="8" rx="4" fill="#C4923A" opacity="0.3"/>
    <rect x="60" y="0" width="24" height="8" rx="4" fill="#3B82F6" opacity="0.3"/>
  </g>
</svg>