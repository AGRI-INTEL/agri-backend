<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Network nodes -->
  <g fill="#3B82F6" fill-opacity="0.06">
    <circle cx="100" cy="100" r="40"/><circle cx="200" cy="80" r="25"/><circle cx="350" cy="120" r="35"/>
    <circle cx="500" cy="60" r="20"/><circle cx="650" cy="100" r="30"/><circle cx="720" cy="150" r="25"/>
    <circle cx="80" cy="300" r="30"/><circle cx="180" cy="250" r="25"/><circle cx="300" cy="280" r="35"/>
    <circle cx="450" cy="220" r="20"/><circle cx="600" cy="300" r="30"/><circle cx="750" cy="280" r="25"/>
    <circle cx="150" cy="450" r="25"/><circle cx="300" cy="420" r="30"/><circle cx="500" cy="450" r="35"/>
    <circle cx="650" cy="420" r="25"/><circle cx="80" cy="500" r="20"/><circle cx="720" cy="500" r="30"/>
  </g>
  <!-- Network connections -->
  <g stroke="#3B82F6" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="100" x2="200" y2="80"/><line x1="200" y1="80" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="500" y2="60"/><line x1="500" y1="60" x2="650" y2="100"/>
    <line x1="650" y1="100" x2="720" y2="150"/><line x1="80" y1="300" x2="180" y2="250"/>
    <line x1="180" y1="250" x2="300" y2="280"/><line x1="300" y1="280" x2="450" y2="220"/>
    <line x1="450" y1="220" x2="600" y2="300"/><line x1="600" y1="300" x2="750" y2="280"/>
    <line x1="150" y1="450" x2="300" y2="420"/><line x1="300" y1="420" x2="500" y2="450"/>
    <line x1="500" y1="450" x2="650" y2="420"/><line x1="80" y1="500" x2="150" y2="450"/>
    <line x1="650" y1="420" x2="720" y2="500"/>
    <!-- Cross layer connections -->
    <line x1="200" y1="80" x2="180" y2="250"/><line x1="350" y1="120" x2="300" y2="280"/>
    <line x1="500" y1="60" x2="450" y2="220"/><line x1="300" y1="280" x2="300" y2="420"/>
    <line x1="600" y1="300" x2="650" y2="420"/>
  </g>
</svg>