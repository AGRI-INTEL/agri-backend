    <path d="M720 480 Q730 450 750 440 Q770 450 780 480 Q770 500 750 510 Q730 500 720 480z"/>
  </g>
  <!-- Subtle line pattern -->
  <g stroke="#C4923A" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="600"/>
    <line x1="100" y1="0" x2="800" y2="525"/>
    <line x1="200" y1="0" x2="800" y2="450"/>
    <line x1="0" y1="100" x2="700" y2="600"/>
    <line x1="0" y1="200" x2="600" y2="600"/>
    <line x1="0" y1="300" x2="500" y2="600"/>
  </g>
</svg>